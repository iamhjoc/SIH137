version: "3.9"

services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: sih_user
      POSTGRES_PASSWORD: sih_pass
      POSTGRES_DB: sih26137
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sih_user -d sih26137"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    env_file: .env
    volumes:
      - ./app:/code/app
      - ./migrations:/code/migrations
      - object_storage:/data/object-storage
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: .
    command: celery -A app.workers.celery_app worker --loglevel=INFO --concurrency=2
    env_file: .env
    volumes:
      - ./app:/code/app
      - object_storage:/data/object-storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ../frontend
      # Dev default: no VITE_API_BASE, so the built app falls back to the
      # relative "/api/v1" (see api/client.ts) and this nginx.conf's
      # "/api/" location proxies that straight to the "api" service --
      # no build-arg needed for local docker-compose use.
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  pgdata:
  object_storage:
