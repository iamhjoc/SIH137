server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Reverse-proxy API calls to the backend container so the built
    # (static) frontend can reach it without CORS or a separate public
    # hostname -- VITE_API_BASE defaults to "/api/v1" (see api/client.ts),
    # and the backend serves everything under that same "/api/v1" prefix
    # (see app/core/config.py's api_v1_prefix), so forwarding the request
    # unmodified to the "api" service (its docker-compose service name)
    # lines up exactly.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Single-page app: any unknown path falls back to index.html so
    # react-router's client-side routes (e.g. /optimization) work on
    # a hard refresh, not just client-side navigation.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
